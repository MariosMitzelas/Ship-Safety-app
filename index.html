<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Λίστα Ελέγχου Ασφαλείας</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; }
        #checklist { margin-top: 20px; text-align: left; display: inline-block; }
        .task-item { margin: 10px 0; font-size: 18px; }
    </style>
</head>
<body>

    <h1>Έλεγχος Ασφαλείας</h1>
    <button onclick="loadChecklist('QR123')">Φόρτωση Λίστας QR123</button>

    <div id="checklist"></div>

    <script>
        function loadChecklist(qrId) {
            fetch('/get_checklist?qr_id=' + qrId)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('checklist');
                    if (data.error) {
                        container.innerHTML = '<p>' + data.error + '</p>';
                    } else {
                        let html = '<h2>Λίστα για τον κωδικό: ' + data.qr_id + '</h2>';
                        data.checklist.forEach(item => {
                            html += '<div class="task-item"><input type="checkbox" id="step' + item.step + '"> <label for="step' + item.step + '">' + item.checkpoint + '</label></div>';
                        });
                        container.innerHTML = html;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }
    </script>
</body>
</html>
