<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Inspection</title>
    <style>
        :root {
            --primary: #004080;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --success: #28a745;
            --border-color: #e1e4e8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .mobile-layout {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .header {
            background: var(--primary);
            color: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .content {
            padding: 20px;
            flex: 1;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .section-header {
            font-size: 1rem;
            font-weight: 700;
            margin: 25px 0 15px 0;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }

        .check-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.1s;
        }

        .check-card:active {
            transform: scale(0.98);
        }

        .check-card input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .check-info {
            flex: 1;
        }

        .check-step {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .check-text {
            font-size: 0.95rem;
            font-weight: 500;
            margin: 2px 0 0 0;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,64,128,0.3);
        }
    </style>
</head>
<body>

<div class="mobile-layout">
    <div class="header">
        <h1>Equipment Inspection</h1>
        <p>Operational Safety Checklist</p>
    </div>

    <form class="content" action="/submit_checklist" method="POST">
        <!-- Το κρυφό πεδίο για το QR ID παραμένει για τη σωστή λειτουργία -->
        <input type="hidden" id="qr_id_field" name="qr_id" value="">

        <div class="form-group">
            <label for="sailor_name">Inspector Name</label>
            <input type="text" id="sailor_name" name="sailor_name" required placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="shift">Shift</label>
            <select id="shift" name="shift" required>
                <option value="" disabled selected>Select your shift</option>
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Night">Night</option>
            </select>
        </div>

        <div class="section-header">Verification Items</div>

        <div id="checklist_container">
            <!-- Τα σημεία ελέγχου θα εμφανιστούν εδώ δυναμικά -->
        </div>

        <button type="submit" class="submit-btn" id="submit_button" disabled>Submit Inspection</button>
    </form>
</div>

<script>
    // Υποθέτουμε ότι η λογική ανάκτησης των δεδομένων παραμένει ίδια
    // Απλά βεβαιώσου ότι μετά τη φόρτωση ενεργοποιείς το κουμπί υποβολής
    document.getElementById('submit_button').removeAttribute('disabled');
</script>

</body>
</html>
