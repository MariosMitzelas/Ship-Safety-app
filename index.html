<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Λίστας Ελέγχου</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        #reader { width: 300px; margin: auto; }
        #checklist { margin-top: 20px; text-align: left; display: inline-block; }
        .task-item { margin: 10px 0; font-size: 18px; }
    </style>
</head>
<body>

    <h1>Σκανάρετε τον Κωδικό QR</h1>
    <div id="reader"></div>

    <div id="checklist"></div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            html5QrcodeScanner.clear();
            loadChecklist(decodedText);
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);

        function loadChecklist(qrId) {
            fetch('/get_checklist?qr_id=' + qrId)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('checklist');
                    if (data.error) {
                        container.innerHTML = '<p>' + data.error + '</p>';
                    } else {
                        let html = '<h2>Λίστα για τον κωδικό: ' + data.qr_id + '</h2>';
                        data.checklist.forEach(item => {
                            html += '<div class="task-item"><input type="checkbox" id="step' + item.step + '"> <label for="step' + item.step + '">' + item.checkpoint + '</label></div>';
                        });
                        container.innerHTML = html;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }
    </script>
</body>
</html>
