<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner & Υποβολή Λίστας Ελέγχου</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; max-width: 600px; margin: auto; text-align: center; }
        #reader { width: 100%; max-width: 320px; margin: 0 auto 15px; }
        #form-container { display: none; text-align: left; margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background-color: #fdfdfd; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        select { width: 100%; padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #aaa; }
        .task-item { display: flex; align-items: center; margin: 10px 0; padding: 8px; background: #f1f1f1; border-radius: 4px; }
        .task-item input[type="checkbox"] { transform: scale(1.3); margin-right: 12px; cursor: pointer; }
        .task-item label { margin: 0; font-weight: normal; font-size: 15px; cursor: pointer; }
        button.btn-submit { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: #fff; background-color: #007bff; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button.btn-submit:disabled { background-color: #6c757d; cursor: not-allowed; }
        #status-msg { margin-top: 15px; font-weight: bold; }
        .status-success { color: #28a745; }
        .status-error { color: #dc3545; }
    </style>
</head>
<body>

    <h2>Σύστημα Ελέγχου Εξοπλισμού</h2>
    <div id="reader"></div>

    <div id="status-msg"></div>

    <div id="form-container">
        <h3 id="form-title"></h3>

        <div class="form-group">
            <label for="shift-select">Βάρδια (Shift):</label>
            <select id="shift-select">
                <option value="Morning">Πρωινή (08:00 - 16:00)</option>
                <option value="Evening">Απογευματινή (16:00 - 00:00)</option>
                <option value="Night">Νυχτερινή (00:00 - 08:00)</option>
            </select>
        </div>

        <div id="checklist-tasks"></div>

        <button id="submit-btn" class="btn-submit" onclick="submitChecklist()">Υποβολή Ελέγχου</button>
    </div>

    <script>
        let currentQrId = null;
        let currentChecklistData = [];

        function setStatus(text, isError = false) {
            const msgEl = document.getElementById('status-msg');
            msgEl.textContent = text;
            msgEl.className = isError ? 'status-error' : 'status-success';
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            loadChecklist(decodedText.trim());
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);

        function loadChecklist(qrId) {
            setStatus('Φόρτωση λίστας...');
            fetch('/get_checklist?qr_id=' + encodeURIComponent(qrId))
                .then(res => {
                    if (!res.ok) throw new Error('Checklist not found or server error');
                    return res.json();
                })
                .then(data => {
                    if (data.error) {
                        setStatus(data.error, true);
                        return;
                    }

                    currentQrId = data.qr_id;
                    currentChecklistData = data.checklist;

                    document.getElementById('form-title').innerText = data.title || ('Λίστα: ' + data.qr_id);
                    const container = document.getElementById('checklist-tasks');
                    container.innerHTML = '';

                    data.checklist.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'task-item';
                        div.innerHTML = `
                            <input type="checkbox" id="chk_${item.step}" data-step="${item.step}">
                            <label for="chk_${item.step}">${item.step}. ${item.checkpoint}</label>
                        `;
                        container.appendChild(div);
                    });

                    document.getElementById('form-container').style.display = 'block';
                    setStatus('');
                })
                .catch(err => {
                    setStatus('Σφάλμα: ' + err.message, true);
                });
        }

        function submitChecklist() {
            const submitBtn = document.getElementById('submit-btn');
            const shift = document.getElementById('shift-select').value;

            const itemsPayload = currentChecklistData.map(item => {
                const chk = document.getElementById('chk_' + item.step);
                return {
                    step: item.step,
                    checkpoint: item.checkpoint,
                    completed: chk ? chk.checked : false
                };
            });

            const payload = {
                qr_id: currentQrId,
                shift: shift,
                items: itemsPayload
            };

            submitBtn.disabled = true;
            setStatus('Αποστολή δεδομένων...');

            fetch('/submit_checklist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                submitBtn.disabled = false;
                if (result.success) {
                    setStatus('Ο έλεγχος καταχωρήθηκε επιτυχώς.', false);
                    document.getElementById('form-container').style.display = 'none';
                    html5QrcodeScanner.render(onScanSuccess);
                } else {
                    setStatus('Αποτυχία: ' + (result.error || 'Άγνωστο σφάλμα'), true);
                }
            })
            .catch(err => {
                submitBtn.disabled = false;
                setStatus('Σφάλμα σύνδεσης: ' + err.message, true);
            });
        }
    </script>
</body>
</html>
