<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Inspection</title>
    <style>
        :root {
            --primary: #004080;
            --primary-dark: #002d5a;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --success: #28a745;
            --border-color: #e1e4e8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .mobile-layout {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .header {
            background: var(--primary);
            color: #ffffff;
            padding: 25px 20px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .header p {
            margin: 8px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .content {
            padding: 20px;
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        .section-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 30px 0 15px 0;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .check-card {
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .check-card:hover {
            border-color: #cbd5e1;
            background-color: #fafafa;
        }

        .check-card input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            accent-color: var(--success);
            cursor: pointer;
            flex-shrink: 0;
        }

        .check-info {
            flex: 1;
        }

        .check-step {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2px;
        }

        .check-text {
            font-size: 0.95rem;
            font-weight: 500;
            margin: 0;
            color: var(--text-color);
            line-height: 1.3;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0,64,128,0.3);
            transition: transform 0.1s, opacity 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="mobile-layout">
    <div class="header">
        <h1>Equipment Inspection</h1>
        <p>Operational Safety Checklist</p>
    </div>

    <form class="content" action="/submit_checklist" method="POST">
        <!-- Κρυφό πεδίο για το QR ID -->
        <input type="hidden" id="qr_id_field" name="qr_id" value="">

        <div class="form-group">
            <label for="sailor_name">Inspector Name</label>
            <input type="text" id="sailor_name" name="sailor_name" required placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="shift">Shift</label>
            <select id="shift" name="shift" required>
                <option value="" disabled selected>Select your shift</option>
                <option value="00:00 - 04:00">00:00 - 04:00</option>
                <option value="04:00 - 08:00">04:00 - 08:00</option>
                <option value="08:00 - 12:00">08:00 - 12:00</option>
                <option value="12:00 - 16:00">12:00 - 16:00</option>
                <option value="16:00 - 20:00">16:00 - 20:00</option>
                <option value="20:00 - 24:00">20:00 - 24:00</option>
            </select>
        </div>

        <div class="section-header">Verification Items</div>

        <div id="checklist_container">
            <!-- Τα σημεία ελέγχου φορτώνονται δυναμικά εδώ -->
        </div>

        <button type="submit" class="submit-btn" id="submit_button">Submit Inspection</button>
    </form>
</div>

<script>
    // Υποθέτουμε τη λειτουργία ανάκτησης δεδομένων που χρησιμοποιείς
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('qr_id');
        if (qrId) {
            document.getElementById('qr_id_field').value = qrId;
            fetch(`/get_checklist?qr_id=${qrId}`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('checklist_container');
                    container.innerHTML = '';
                    data.checklist.forEach(item => {
                        const card = document.createElement('label');
                        card.className = 'check-card';
                        card.innerHTML = `
                            <input type="checkbox" name="items" value='${JSON.stringify({step: item.step, checkpoint: item.checkpoint})}'>
                            <div class="check-info">
                                <span class="check-step">STEP ${item.step}</span>
                                <p class="check-text">${item.checkpoint}</p>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => console.error('Error loading checklist:', err));
        }
    };
</script>

</body>
</html>
