<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σύστημα Ελέγχου Εξοπλισμού</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 15px; 
            max-width: 600px; 
            margin: auto; 
            text-align: center; 
        }
        #reader { 
            width: 100%; 
            max-width: 320px; 
            margin: 0 auto 15px; 
        }
        #form-container { 
            display: none; 
            text-align: left; 
            margin-top: 20px; 
            padding: 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            background-color: #fdfdfd; 
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px; 
        }
        select, input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            font-size: 16px; 
            border-radius: 6px; 
            border: 1px solid #aaa; 
            background: #fff;
            box-sizing: border-box;
        }
        .task-item { 
            display: flex; 
            align-items: center; 
            margin: 10px 0; 
            padding: 10px; 
            background: #f1f1f1; 
            border-radius: 6px; 
        }
        .task-item input[type="checkbox"] { 
            transform: scale(1.4); 
            margin-right: 14px; 
            cursor: pointer; 
        }
        .task-item label { 
            margin: 0; 
            font-weight: normal; 
            font-size: 15px; 
            cursor: pointer; 
        }
        button.btn-submit { 
            width: 100%; 
            padding: 14px; 
            font-size: 17px; 
            font-weight: bold; 
            color: #fff; 
            background-color: #007bff; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 15px; 
        }
        button.btn-submit:disabled { 
            background-color: #6c757d; 
            cursor: not-allowed; 
        }
        #status-msg { 
            margin-top: 15px; 
            font-weight: bold; 
            font-size: 16px; 
        }
        .status-success { color: #28a745; }
        .status-error { color: #dc3545; }
    </style>
</head>
<body>

    <h2>Σύστημα Ελέγχου Εξοπλισμού</h2>
    <div id="reader"></div>

    <div id="status-msg"></div>

    <div id="form-container">
        <h3 id="form-title"></h3>

        <div class="form-group">
            <label for="sailor-name">Όνομα Ναυτίου:</label>
            <input type="text" id="sailor-name" placeholder="Εισάγετε ονοματεπώνυμο">
        </div>

        <div class="form-group">
            <label for="shift-select">Βάρδια (Watch / Shift):</label>
            <select id="shift-select">
                <option value="00:00 - 04:00">00:00 - 04:00</option>
                <option value="04:00 - 08:00">04:00 - 08:00</option>
                <option value="08:00 - 12:00">08:00 - 12:00</option>
                <option value="12:00 - 16:00">12:00 - 16:00</option>
                <option value="16:00 - 20:00">16:00 - 20:00</option>
                <option value="20:00 - 00:00">20:00 - 00:00</option>
            </select>
        </div>

        <div id="checklist-tasks"></div>

        <button id="submit-btn" class="btn-submit" onclick="submitChecklist()">Υποβολή Ελέγχου</button>
    </div>

    <script>
        let currentQrId = null;
        let currentChecklistData = [];

        function setStatus(text, isError = false) {
            const msgEl = document.getElementById('status-msg');
            msgEl.textContent = text;
            msgEl.className = isError ? 'status-error' : 'status-success';
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            loadChecklist(decodedText.trim());
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);

        function loadChecklist(qrId) {
            setStatus('Φόρτωση λίστας...');
            fetch('/get_checklist?qr_id=' + encodeURIComponent(qrId))
                .then(res => {
                    if (!res.ok) throw new Error('Η λίστα δεν βρέθηκε ή υπάρχει σφάλμα');
                    return res.json();
                })
                .then(data => {
                    if (data.error) {
                        setStatus(data.error, true);
                        return;
                    }

                    currentQrId = data.qr_id;
                    currentChecklistData = data.checklist;

                    document.getElementById('form-title').innerText = data.title || ('Λίστα: ' + data.qr_id);
                    const container = document.getElementById('checklist-tasks');
                    container.innerHTML = '';

                    data.checklist.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'task-item';
                        div.innerHTML = `
                            <input type="checkbox" id="chk_${item.step}" class="task-chk" data-step="${item.step}">
                            <label for="chk_${item.step}">${item.step}. ${item.checkpoint}</label>
                        `;
                        container.appendChild(div);
                    });

                    document.getElementById('form-container').style.display = 'block';
                    setStatus('');
                })
                .catch(err => {
                    setStatus('Σφάλμα: ' + err.message, true);
                });
        }

        function submitChecklist() {
            const sailorName = document.getElementById('sailor-name').value.trim();
            if (!sailorName) {
                setStatus('Παρακαλώ εισάγετε το όνομα του ναύτη πριν την υποβολή.', true);
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            const shift = document.getElementById('shift-select').value;
            const checkboxes = document.querySelectorAll('#checklist-tasks .task-chk');

            if (checkboxes.length === 0) {
                setStatus('Δεν βρέθηκαν σημεία ελέγχου.', true);
                return;
            }

            let allChecked = true;
            checkboxes.forEach(chk => {
                if (!chk.checked) {
                    allChecked = false;
                }
            });

            if (!allChecked) {
                setStatus('Δεν σου επιτρέπεται να κάνεις υποβολή. Πρέπει να τσεκάρεις όλα τα items!', true);
                return;
            }

            const itemsPayload = currentChecklistData.map(item => {
                const chk = document.getElementById('chk_' + item.step);
                return {
                    step: item.step,
                    checkpoint: item.checkpoint,
                    completed: chk ? chk.checked : false
                };
            });

            const payload = {
                qr_id: currentQrId,
                sailor_name: sailorName,
                shift: shift,
                items: itemsPayload
            };

            submitBtn.disabled = true;
            setStatus('Αποστολή δεδομένων...');

            fetch('/submit_checklist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                submitBtn.disabled = false;
                if (result.success) {
                    setStatus('Ο έλεγχος καταχωρήθηκε επιτυχώς.', false);
                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('sailor-name').value = '';
                    html5QrcodeScanner.render(onScanSuccess);
                } else {
                    setStatus('Αποτυχία: ' + (result.error || 'Άγνωστο σφάλμα'), true);
                }
            })
            .catch(err => {
                submitBtn.disabled = false;
                setStatus('Σφάλμα σύνδεσης: ' + err.message, true);
            });
        }
    </script>
</body>
</html>
