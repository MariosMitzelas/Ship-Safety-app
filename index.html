<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Security Inspection</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .checkbox-group {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .checkbox-item:last-child {
            margin-bottom: 0;
        }
        .checkbox-item input[type="checkbox"] {
            transform: scale(1.3);
            margin-right: 15px;
        }
        .checkbox-item label {
            margin-bottom: 0;
            cursor: pointer;
            font-weight: normal;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Safety Security Inspection</h2>
    <form action="/submit" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="sailor_name">Sailor Name:</label>
            <input type="text" id="sailor_name" name="sailor_name" required>
        </div>

        <div class="form-group">
            <label for="shift">Choose Watch:</label>
            <select id="shift" name="shift" required>
                <option value="">--Select 4-Hour Watch--</option>
                <option value="00:00 - 04:00">00:00 - 04:00</option>
                <option value="04:00 - 08:00">04:00 - 08:00</option>
                <option value="08:00 - 12:00">08:00 - 12:00</option>
                <option value="12:00 - 16:00">12:00 - 16:00</option>
                <option value="16:00 - 20:00">16:00 - 20:00</option>
                <option value="20:00 - 24:00">20:00 - 24:00</option>
            </select>
        </div>

        <div class="form-group">
            <label for="qr_image">Scan Location QR (Camera) or Upload Photos:</label>
            <input type="file" id="qr_image" name="qr_image" accept="image/*" capture="environment" multiple required>
        </div>

        <div class="checkbox-group">
            <label>Verify Checkpoints:</label>
            
            <div class="checkbox-item">
                <input type="checkbox" id="item1" name="items" value="Lifebuoys and flares check" required>
                <label for="item1">Lifebuoys and flares check</label>
            </div>
            
            <div class="checkbox-item">
                <input type="checkbox" id="item2" name="items" value="Fire hoses and hydrants check" required>
                <label for="item2">Fire hoses and hydrants check</label>
            </div>
            
            <div class="checkbox-item">
                <input type="checkbox" id="item3" name="items" value="Water-tight doors secured" required>
                <label for="item3">Water-tight doors secured</label>
            </div>
            
            <div class="checkbox-item">
                <input type="checkbox" id="item4" name="items" value="Navigation lights functioning" required>
                <label for="item4">Navigation lights functioning</label>
            </div>
            
            <div class="checkbox-item">
                <input type="checkbox" id="item5" name="items" value="Emergency exits clear" required>
                <label for="item5">Emergency exits clear</label>
            </div>
        </div>

        <button type="submit">Submit Inspection</button>
    </form>
</div>

</body>
</html>
